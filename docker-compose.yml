services:
  app:
    build: .
    image: omnirush-report-agent
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./backend/data/runs:/app/backend/data/runs
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
