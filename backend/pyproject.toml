[project]
name = "omnirush-report-agent-backend"
version = "0.1.0"
description = "Backend foundation for the One-Click Research Report Agent"
readme = "../README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "httpx==0.28.1",
    "markdown==3.7",
    "openai==1.59.9",
    "pydantic-settings==2.7.1",
    "scrapling[fetchers]==0.4.15",
    "tavily-python==0.5.0",
    "trafilatura==1.12.2",
    "uvicorn[standard]==0.34.0",
    "weasyprint==63.1",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "ruff==0.9.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
